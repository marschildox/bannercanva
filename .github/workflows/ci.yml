name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      # `vite build` succeeding doesn't prove the bundle runs — a bad chunk
      # split once shipped a blank page while dev, types and tests were green.
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Smoke-test the production build
        run: npm run smoke
